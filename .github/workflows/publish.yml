name: Publish VS Code Extension

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v1.10.0
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: marketplace-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: marketplace
    env:
      MARKETPLACE_AUTH: ${{ vars.MARKETPLACE_AUTH }}
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Validate tag and extension version
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          version="$(node -p "require('./package.json').version")"
          if [[ "$tag" != "v$version" ]]; then
            echo "Release tag '$tag' does not match package version 'v$version'." >&2
            exit 1
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "EXTENSION_VERSION=$version" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Run tests
        run: npm test

      - name: Build release package
        run: npm run package

      - name: Publish with Marketplace trusted publishing
        if: env.MARKETPLACE_AUTH == 'oidc'
        run: >-
          npx --no-install vsce publish
          --oidc
          --packagePath "releases/v${EXTENSION_VERSION}/gwm-${EXTENSION_VERSION}.vsix"

      - name: Publish with temporary Marketplace PAT
        if: env.MARKETPLACE_AUTH != 'oidc' && env.VSCE_PAT != ''
        run: >-
          npx --no-install vsce publish
          --packagePath "releases/v${EXTENSION_VERSION}/gwm-${EXTENSION_VERSION}.vsix"

      - name: Explain skipped Marketplace publishing
        if: env.MARKETPLACE_AUTH != 'oidc' && env.VSCE_PAT == ''
        run: echo "::notice::Marketplace publishing skipped; configure MARKETPLACE_AUTH=oidc or the VSCE_PAT secret to publish automatically."

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: gwm-v${{ env.EXTENSION_VERSION }}
          path: releases/v${{ env.EXTENSION_VERSION }}/

      - name: Extract GitHub Release notes
        shell: bash
        run: |
          set -euo pipefail
          awk -v version="$EXTENSION_VERSION" '
            $0 ~ "^## " version "([[:space:]]|$)" { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          test -s "$RUNNER_TEMP/release-notes.md"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          vsix="releases/v${EXTENSION_VERSION}/gwm-${EXTENSION_VERSION}.vsix"
          checksums="releases/v${EXTENSION_VERSION}/SHA256SUMS"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "GWM $RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
            gh release upload "$RELEASE_TAG" "$vsix" "$checksums" --clobber
          else
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --title "GWM $RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              "$vsix" "$checksums"
          fi
